name: urbanheatopt_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.2
  - pip=24.0
  - numpy=2.1.3
  - pandas=2.2.2
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - networkx=3.6.1
  - fiona=1.10.1
