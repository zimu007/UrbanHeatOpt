  - pytest=9.1.1
  - jsonschema=4.26.0
  - pyomo=6.8.2
  - ipykernel=6.29.5
  - jupyter=1.1.1
  - matplotlib=3.10.0
  - nbformat=5.10.4
  - notebook=7.3.2
  - numba=0.61.0
  - openpyxl=3.1.5
  - osmnx=2.0.1
  - plotly=6.0.0
