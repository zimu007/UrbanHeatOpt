[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanheatopt-competition"
version = "2.0.0.dev0"
description = "Versioned district heating planning, validated inputs and reproducible results"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urbanheatopt = ["data/schemas/*.json", "data/schemas/*.yaml", "data/profile_resources/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
